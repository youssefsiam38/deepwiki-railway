# Local test topology. Mirrors the Railway service: one container running the API, the Next.js app and the Caddy
# basic-auth front-door, with one volume for the .adalflow data (repo clones + embeddings).
name: deepwiki-railway-test

services:
  app:
    # Built from this repository. CI and the Railway template use the published GHCR image instead.
    build:
      context: .
      dockerfile: images/app/Dockerfile
      args:
        WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${DEEPWIKI_RAILWAY_IMAGE:-deepwiki-railway:local}
    restart: unless-stopped
    environment:
      PORT: '8080'
      OWNER_PASSWORD: ${DEEPWIKI_TEST_OWNER_PASSWORD:-local-test-only-owner-password}
      OWNER_USERNAME: ${DEEPWIKI_TEST_OWNER_USERNAME:-owner}
      # No LLM key in local tests: the UI/API/front-door and auth are exercised; wiki generation is not.
    ports:
      - '127.0.0.1:${DEEPWIKI_TEST_PORT:-13900}:8080'
    volumes:
      - adalflow:/root/.adalflow

volumes:
  adalflow:
